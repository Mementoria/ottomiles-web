<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 -2 415 415" role="img" aria-labelledby="ottoIconTitle ottoIconDesc">
<title id="ottoIconTitle">OttoMiles app icon — Otto mid-wave</title>
<desc id="ottoIconDesc">Derived from otto-standing.svg per docs/superpowers/specs/2026-07-01-otto-app-icon-design.md: waist-up crop on the accent-blue radial ground, wave arm frozen at -114 degrees, ready smile, soft glow behind the antenna beacon. The artwork group (swayg) is nudged 20 units right for compositional balance; the background rect stays on the viewBox. Static file: the attribute transforms (armF rotation, swayg nudge) are safe because no CSS (and no transform-box) ever applies to this document.</desc>
