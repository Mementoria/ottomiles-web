<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OttoMiles — Coming soon</title>
    <meta
      name="description"
      content="OttoMiles — effortless mileage and earnings tracking for rideshare and delivery drivers. Coming soon for iOS and Android."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#2680FA" />

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="OttoMiles — Coming soon" />
    <meta
      property="og:description"
      content="Effortless mileage and earnings tracking for rideshare and delivery drivers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ottomiles.app/" />
    <meta property="og:image" content="https://ottomiles.app/poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      :root {
        --bg: #f4f1ea;
        --bg-glow: #e7f0fb;
        --ink: #1c2634;
        --muted: #5a6675;
        --card: #ffffff;
        --accent: #2680fa;
        --wm-otto: #22508b;
        --wm-miles: #5095cc;
        --hairline: rgba(28, 38, 52, 0.12);
        --chip-bg: rgba(28, 38, 52, 0.05);
        --shadow: 0 24px 60px -24px rgba(15, 39, 64, 0.4);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0d1017;
          --bg-glow: #12233b;
          --ink: #eef2f7;
          --muted: #9aa7b6;
          --card: #151a22;
          --wm-otto: #6fa6ee;
          --wm-miles: #8fc0f0;
          --hairline: rgba(255, 255, 255, 0.12);
          --chip-bg: rgba(255, 255, 255, 0.06);
          --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.65);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.5rem, 4vh, 2.75rem);
        padding: clamp(1.5rem, 5vw, 3rem);
        background:
          radial-gradient(120% 90% at 50% -10%, var(--bg-glow), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family:
          system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      .stage {
        width: 100%;
        max-width: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3.5vh, 2rem);
      }

      /* Video hero */
      .video-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--shadow);
        background: #cfe0f2;
        isolation: isolate;
      }
      .video-wrap video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .play-btn {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: 80px;
        height: 80px;
        border: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #fff;
        background: var(--accent);
        box-shadow:
          0 10px 30px -6px rgba(38, 128, 250, 0.6),
          0 0 0 10px rgba(255, 255, 255, 0.18);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          opacity 0.25s ease;
      }
      .play-btn:hover {
        transform: translateX(-50%) scale(1.06);
      }
      .play-btn:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .play-btn svg {
        width: 34px;
        height: 34px;
        margin-left: 4px;
      }
      .video-wrap.playing .play-btn {
        opacity: 0;
        pointer-events: none;
      }

      /* Wordmark — traced SVG; dual-shade fills driven by --wm-otto / --wm-miles */
      .wordmark-svg {
        display: block;
        width: auto;
        height: clamp(2.1rem, 8vw, 3.4rem);
        max-width: 100%;
        stroke-width: 16;
        stroke-linejoin: round;
      }
      .wm-otto {
        fill: var(--wm-otto, #22508b);
        stroke: var(--wm-otto, #22508b);
      }
      .wm-miles {
        fill: var(--wm-miles, #5095cc);
        stroke: var(--wm-miles, #5095cc);
      }

      .tagline {
        margin: 0;
        max-width: 34ch;
        font-size: clamp(1rem, 2.6vw, 1.2rem);
        line-height: 1.5;
        color: var(--muted);
      }

      /* Coming-soon badges */
      .soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
      }
      .soon-label {
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.6rem 1.05rem;
        border-radius: 999px;
        border: 1px solid var(--hairline);
        background: var(--chip-bg);
        color: var(--ink);
        font-size: 0.95rem;
        font-weight: 600;
      }
      .badge svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      footer {
        font-size: 0.8rem;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 1.25rem;
      }
      footer a {
        color: var(--muted);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>

      <h1 class="visually-hidden">OttoMiles — coming soon for iOS and Android</h1>

        <video

          <source src="ottomiles-teaser.mp4" type="video/mp4" />
        </video>
        <button class="play-btn" type="button" aria-label="Play the OttoMiles teaser">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="currentColor" />
          </svg>
        </button>
      </div>

    </main>

    <footer>
      <span>&copy; <span id="yr">2026</span> Mementoria</span>
      <a href="privacy/">Privacy</a>
      <a href="terms/">Terms</a>
    </footer>

    <script>
      const wrap = document.querySelector('.video-wrap');
      const video = document.getElementById('teaser');
      const btn = document.querySelector('.play-btn');

      btn.addEventListener('click', () => {
        video.play();
      });
      video.addEventListener('play', () => {
        wrap.classList.add('playing');
        video.controls = true;
      });
      video.addEventListener('ended', () => {
        wrap.classList.remove('playing');
        video.controls = false;
        video.load(); // restore the poster frame
      });

      const yr = document.getElementById('yr');
      if (yr) yr.textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
